spring:
  application:
    name: courier-tracking
  datasource:
    url: jdbc:h2:mem:courier;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  h2:
    console:
      enabled: true
      path: /h2-console
courier:
  stores-location: classpath:stores.json
  distance:
    strategy: HAVERSINE

logging:
  level:
    com.example.couriertracking: INFO